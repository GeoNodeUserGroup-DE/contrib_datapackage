# Test stack for the datapackage contrib app. Deliberately smaller than
# GeoNode's own docker-compose-test.yml: no nginx, no celery, no memcached -
# the suite talks to Django and the databases directly. The django service is
# only a shell to exec into, so nothing here depends on it being healthy.

services:

  # GeoNode + this contrib app installed from the checkout under test.
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django4${COMPOSE_PROJECT_NAME}
    environment:
      - IS_CELERY=False
    command: 'sleep infinity'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env_test
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - data:/data
      - tmp:/tmp
      - .:/usr/src/contrib_datapackage

  # Geoserver backend. Not exercised directly by the suite, but creating a
  # Dataset syncs its permissions to GeoFence, so it has to be reachable.
  geoserver:
    image: geonode/geoserver:2.28.4-latest
    container_name: geoserver4${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: "curl -m 10 --fail --silent --write-out 'HTTP CODE : %{http_code}\n' --output /dev/null http://geoserver:8080/geoserver/ows"
      start_period: 60s
      interval: 20s
      timeout: 10s
      retries: 5
    env_file:
      - .env_test
    volumes:
      - statics:/mnt/volumes/statics
      - geoserver-data-dir:/geoserver_data/data
      - data:/data
      - tmp:/tmp
    restart: unless-stopped
    depends_on:
      data-dir-conf:
        condition: service_healthy

  data-dir-conf:
    image: geonode/geoserver_data:2.28.4-latest
    container_name: gsconf4${COMPOSE_PROJECT_NAME}
    entrypoint: sleep infinity
    volumes:
      - geoserver-data-dir:/geoserver_data/data
    restart: unless-stopped
    healthcheck:
      test: "ls -A '/geoserver_data/data' | wc -l"

  # PostGIS database.
  db:
    image: geonode/postgis:15-3.5-latest
    command: postgres -c "max_connections=${POSTGRESQL_MAX_CONNECTIONS}"
    container_name: db4${COMPOSE_PROJECT_NAME}
    env_file:
      - .env_test
    volumes:
      - dbdata:/var/lib/postgresql/data
      - dbbackups:/pg_backups
    restart: unless-stopped
    healthcheck:
      test: "pg_isready -d postgres -U postgres"

volumes:
  statics:
    name: ${COMPOSE_PROJECT_NAME}-statics
  geoserver-data-dir:
    name: ${COMPOSE_PROJECT_NAME}-gsdatadir
  dbdata:
    name: ${COMPOSE_PROJECT_NAME}-dbdata
  dbbackups:
    name: ${COMPOSE_PROJECT_NAME}-dbbackups
  data:
    name: ${COMPOSE_PROJECT_NAME}-data
  tmp:
    name: ${COMPOSE_PROJECT_NAME}-tmp
