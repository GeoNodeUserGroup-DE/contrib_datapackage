[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "importer-datapackage"
version = "5.0.0+datapackage001"
description = "Datapackage handler for the geonode-importer"
readme = "README.md"
authors = [
    { name = "52north", email = "info@52north.org" },
    { name = "Marcel Wallschläger", email = "marcel.wallschlaeger@zalf.de" }
]
license = { file = "LICENSE" }
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "License :: OSI Approved :: GNU General Public License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "setuptools>=59",
    "frictionless>=5.18.0",
    # NOTE: no geonode_importer dependency on GeoNode >= 5 — the importer
    # is part of GeoNode core (geonode.upload), and geonode_importer's
    # pins (gdal<=3.4.3) conflict with GeoNode 5 installations.
]

[project.urls]
Homepage = "https://github.com/GeoNodeUserGroup-DE/contrib_datapackage"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["importer_datapackage*"]
